name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER_SMALL || 'cf-2g' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7 # v4

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER_SMALL || 'cf-2g' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      # GitHub only provides Dependency Review when Dependency Graph is
      # available. Private repositories without GHAS still retain the blocking
      # production audit above instead of failing because of the account plan.
      - if: github.event.repository.visibility == 'public'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER_SMALL || 'cf-2g' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      # The gitleaks CLI rather than gitleaks-action, which wants a license key
      # in an organization's repositories. Pinned and checked against its digest.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux_x64 sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            Linux-ARM64) platform=linux_arm64 sha=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            macOS-X64) platform=darwin_x64 sha=dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709 ;;
            macOS-ARM64) platform=darwin_arm64 sha=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
            *) echo "::error::no gitleaks build for $RUNNER_OS $RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_${platform}.tar.gz"
          echo "$sha  $RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Like the action: a pull request or a push scans its own commits, the
      # weekly run every ref's history. .gitleaks.toml applies.
      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = schedule ]; then
            range=--all
          elif [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            range="-1 $HEAD"
          else
            range="$BASE..$HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts="--no-merges $range"

  # The full re-test of every mutant, which the incremental run in ci.yml skips
  # for code and tests that did not change. Weekly only: it gates nothing, so
  # a deploy never waits for it. --force ignores the incremental report.
  mutation-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER_HEAVY || vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:mutation -- --force
