[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public localStorage key for the legal-consent version; not an authentication credential"
condition = "AND"
paths = ['''^src/consent\.ts$''']
regexTarget = "secret"
regexes = ['''^peerly-legal-consent-v1$''']

[[rules.allowlists]]
description = "Test-only secrets the frozen pre-move session tokens were minted with; never deployed"
condition = "AND"
paths = ['''^worker/realtime/legacySessions\.workers\.test\.mjs$''']
regexTarget = "secret"
regexes = ['''^legacy-(session|opaque)-secret-0123456789abcdef$''']
