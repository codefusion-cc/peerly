packages:
  - packages/*

# Install scripts run only for these; any other dependency with one fails the install until it is named here.
allowBuilds:
  esbuild: true
  workerd: true
  # core-js (through @tensorflow/tfjs) only prints a notice.
  core-js: false

engineStrict: true

minimumReleaseAgeExclude:
  - '@codefusion-cc/console@0.34.0'
