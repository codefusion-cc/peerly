packages:
  - packages/*

# Install scripts run only for these; any other dependency with one fails the install until it is named here.
allowBuilds:
  esbuild: true
  workerd: true
  # core-js (through @tensorflow/tfjs) only prints a notice.
  core-js: false

engineStrict: true

# Our own package, newer than pnpm's minimum release age when it was taken.
minimumReleaseAgeExclude:
  - '@codefusion-cc/console@0.34.0'

# Stryker's Vitest runner runs no test for any mutant on Vitest 5 unpatched. The same patch as
# codefusion-cc/codefusion's patches/ (config/stryker), byte for byte.
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
